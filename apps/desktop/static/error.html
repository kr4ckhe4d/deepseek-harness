<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DeepSeek Harness</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #1b1c1d; color: #e8e8e6;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .titlebar { position: fixed; top: 0; left: 0; right: 0; height: 28px; -webkit-app-region: drag; }
  .card { max-width: 640px; width: 90%; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #message { color: #f0a8a8; margin: 0 0 16px; }
  pre {
    background: #101112; color: #9a9b9d; border-radius: 8px; padding: 12px;
    max-height: 260px; overflow: auto; font-size: 12px; white-space: pre-wrap;
  }
  button {
    background: #6a9bff; color: #101112; border: 0; border-radius: 8px;
    padding: 8px 18px; font-size: 14px; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div class="titlebar"></div>
  <div class="card">
    <h1>The backend stopped</h1>
    <p id="message"></p>
    <pre id="log" hidden></pre>
    <button id="retry" type="button">Retry</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    document.getElementById('message').textContent = params.get('message') ?? 'Unknown failure'
    const log = params.get('log') ?? ''
    if (log !== '') {
      const pre = document.getElementById('log')
      pre.textContent = log
      pre.hidden = false
    }
    document.getElementById('retry').addEventListener('click', () => { window.dshDesktop.retryBackend() })
  </script>
</body>
</html>
