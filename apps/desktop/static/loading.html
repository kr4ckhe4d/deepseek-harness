<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DeepSeek Harness</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    background: #1b1c1d; color: #e8e8e6;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-app-region: drag; user-select: none;
  }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #3a3b3d; border-top-color: #6a9bff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: #9a9b9d; font-size: 13px; }
</style>
</head>
<body>
  <div class="spinner" role="progressbar" aria-label="Starting"></div>
  <div>Starting the harness…</div>
  <div class="hint">Booting the local dsh web backend</div>
</body>
</html>
